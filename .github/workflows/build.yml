name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Read-only by default. Only the `release` job publishes anything, and it
# raises its own scope to `contents: write`; PR and main builds never hold it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release metadata is hand-maintained across four files. On a tag build
      # they must all agree, or F-Droid builds the wrong commit / 404s on the
      # binary. Runs before the toolchain setup so a mismatch fails in seconds.
      - name: Check release metadata matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          sha = os.environ["GITHUB_SHA"]
          expected_version = tag[1:] if tag.startswith("v") else tag
          failures = []
          warnings = []

          gradle = pathlib.Path("app/build.gradle.kts").read_text()
          code_match = re.search(r"^\s*versionCode\s*=\s*(\d+)", gradle, re.M)
          name_match = re.search(r'^\s*versionName\s*=\s*"([^"]+)"', gradle, re.M)
          if not code_match or not name_match:
              print("::error::could not read versionCode/versionName from app/build.gradle.kts")
              sys.exit(1)
          version_code = int(code_match.group(1))
          version_name = name_match.group(1)
          print(f"gradle: versionName={version_name} versionCode={version_code}")

          if version_name != expected_version:
              failures.append(
                  f'app/build.gradle.kts versionName "{version_name}" does not match tag '
                  f'{tag} (expected "{expected_version}")'
              )

          recipe_path = pathlib.Path("docs/fdroid/com.megamaced.nccollectives.yml")
          current_version = None
          current_code = None
          builds = []
          entry = None
          in_builds = False
          for line in recipe_path.read_text().splitlines():
              if line.startswith("CurrentVersion:"):
                  current_version, in_builds = line.split(":", 1)[1].strip(), False
                  continue
              if line.startswith("CurrentVersionCode:"):
                  current_code, in_builds = line.split(":", 1)[1].strip(), False
                  continue
              if line.startswith("Builds:"):
                  in_builds = True
                  continue
              if line and not line[0].isspace():
                  in_builds = False
                  continue
              if not in_builds:
                  continue
              new_entry = re.match(r"\s*-\s*versionName:\s*(\S+)", line)
              if new_entry:
                  entry = {"versionName": new_entry.group(1).strip("\"'")}
                  builds.append(entry)
                  continue
              if entry is None:
                  continue
              for key in ("versionCode", "commit"):
                  found = re.match(rf"\s+{key}:\s*(\S+)", line)
                  if found:
                      entry[key] = found.group(1).strip("\"'")

          # The docs/fdroid/ mirror is EXPECTED to lag at tag time. This package
          # is merged into fdroiddata with `AutoUpdateMode: Version` +
          # `UpdateCheckMode: Tags`, so F-Droid's checkupdates bot bumps the
          # recipe itself once the tag exists, and the mirror is re-synced from
          # upstream master in a follow-up `fdroid recipe: sync to vX.Y.Z`
          # commit. Asserting equality here would fail every release and force
          # a moved tag — which for a bot-driven package means burning a
          # version instead. So: warn, never fail, on recipe/gradle skew.
          if current_version != version_name:
              warnings.append(
                  f"{recipe_path}: CurrentVersion {current_version!r} != gradle versionName "
                  f"{version_name!r} — expected pre-sync; re-sync the mirror after this release"
              )
          if current_code != str(version_code):
              warnings.append(
                  f"{recipe_path}: CurrentVersionCode {current_code!r} != gradle versionCode {version_code}"
              )

          if not builds:
              failures.append(f"{recipe_path}: no Builds entries found")
          else:
              last = builds[-1]
              print(f"recipe last Builds entry: {last}")
              if last.get("versionName") != version_name:
                  warnings.append(
                      f"{recipe_path}: last Builds entry versionName {last.get('versionName')!r} "
                      f"!= gradle versionName {version_name!r} — expected pre-sync"
                  )
              if last.get("versionCode") != str(version_code):
                  warnings.append(
                      f"{recipe_path}: last Builds entry versionCode {last.get('versionCode')!r} "
                      f"!= gradle versionCode {version_code} — expected pre-sync"
                  )
              # WARNING, not a failure. The established release flow syncs
              # the recipe in a follow-up commit *after* the tag (the recipe
              # references the tagged commit, so it cannot be written before
              # that SHA exists). Failing here would block every release.
              # Warn so a genuinely forgotten sync is still visible in the
              # build log without gating the publish.
              if last.get("commit") != sha:
                  warnings.append(
                      f"{recipe_path}: last Builds entry commit {last.get('commit')!r} != the tagged "
                      f"commit {sha}. Expected if the recipe is synced in a follow-up commit; "
                      f"make sure that sync lands before F-Droid next scans."
                  )

          changelog = pathlib.Path(f"fastlane/metadata/android/en-US/changelogs/{version_code}.txt")
          if not changelog.is_file():
              failures.append(f"{changelog} is missing")
          elif not changelog.read_text().strip():
              failures.append(f"{changelog} is empty")

          for warning in warnings:
              print(f"::warning::{warning}")
          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # H5: no signing material in this job, on any ref. It used to be
      # decoded here into $GITHUB_ENV on every push to main and every
      # same-repo PR, where every later step -- each Gradle plugin, annotation
      # processor and test dependency, and the actions' post-steps -- could
      # read it. assembleRelease below produces the unsigned APK, which is
      # what F-Droid's builder makes too, and the `sign` job signs on tags.

      # assembleRelease/lintRelease run on every ref, not just tags, so R8 keep
      # rules and resource shrinking are exercised on the PR that breaks them
      # rather than during the release.
      - name: Build
        run: >
          ./gradlew --no-daemon
          ktlintCheck
          lintDebug lintRelease
          testDebugUnitTest
          assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nc_collectives_android-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # The five tests in app/src/androidTest are the only coverage for the seven
  # hand-written Room migrations in data/db/Migrations.kt. They are
  # instrumented, so `testDebugUnitTest` in the `build` job cannot see them —
  # before this job they ran nowhere at all. A migration that drops the wrong
  # table or loses a queued edit fails on the user's next app open, against
  # their only copy of the data, with no way back. This job is that gate.
  #
  # Deliberately a separate job, not extra tasks bolted onto `build`: an
  # emulator boot must never sit in front of ktlint/lint/unit-test feedback,
  # and `release` must not inherit a dependency on emulator uptime.
  instrumented-tests:
    name: instrumented tests
    runs-on: ubuntu-latest
    # No `if:` — this runs on PRs, on main, and on tags. The point of the job
    # is to fail on the commit that *introduces* a bad migration, and that
    # commit arrives in a PR. Gating it to tags would move the alarm to the
    # one moment where the only remedies are moving a tag or burning a
    # version. The workflow-level concurrency group already cancels
    # superseded PR runs, so pushing again does not stack up emulators.
    #
    # Measured at ~2.5 min end to end now that the AVD is created fresh each
    # run (see the test step). 30 is a ceiling with room for a system-image
    # download on a runner image that does not ship one, not a target.
    timeout-minutes: 30
    env:
      # == minSdk, on purpose. These migrations are hand-written SQL, so the
      # hazard is the *oldest* SQLite the app can be installed on, not the
      # newest: MIGRATION_6_7's `ALTER TABLE ... RENAME TO` table rebuild is
      # precisely the statement whose semantics moved between SQLite
      # versions, and the OS ships SQLite. Room's schema validation is
      # identical on every API level, so testing near targetSdk would add
      # nothing that testing at the floor does not already cover, while
      # leaving the floor untested.
      EMULATOR_API_LEVEL: '29'
      # AOSP `default`, not google_apis: nothing here touches Play services,
      # and the smaller image boots faster. arch is set explicitly because the
      # action still defaults to `arch: x86`, the slower 32-bit image, which
      # does not exist at all above API 30 — pinning x86_64 now means raising
      # EMULATOR_API_LEVEL later is a one-line change.
      EMULATOR_TARGET: default
      EMULATOR_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Read-only on every ref, not just PRs (which is what `build` does):
      # `build` runs in the same run and is the cache writer, and two jobs
      # racing to save the same Gradle cache entry is how it ends up thrashed.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Mandatory on ubuntu runners: /dev/kvm exists but is not accessible to
      # the runner user, and without it the emulator either refuses to start
      # or drops to pure software emulation and runs slowly enough to hit the
      # job timeout instead of reporting a result.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The whole variant, not a runner-argument filter narrowed to the
      # data.db package. androidTest holds only MigrationTest today, so a
      # package filter would save nothing measurable against the emulator
      # boot, and it would silently exclude the next instrumented
      # test someone adds — a filter that quietly stops running tests is the
      # exact failure mode this job exists to close. Narrow it only if
      # androidTest later grows something genuinely slow.
      #
      # No AVD snapshot cache, and therefore no cache key to compute and no
      # separate snapshot-generation step. Both of this job's outages came
      # from that cache, and it was never paying for itself:
      #
      #   cold (33666884725): 0s restore + 50s create + 82s test + 11s save
      #                       = 143s, green
      #   warm (33675799329): 22s restore + 162s test = 184s, and it hung
      #
      # The warm path was *slower* than the cold one — same day, same
      # emulator — because extracting the tarball and cold-booting the
      # restored image costs more than creating the AVD next to a warm page
      # cache. Against that, the cache broke the job twice in a week: a
      # snapshot created by an older emulator no longer booted under 37.1.11
      # (green 2026-08-26, then five days of 45-minute idles), and a restored
      # snapshot then failed to bring up its console — `Failed to start
      # Emulator console for 5554` — so `adb emu kill` could not complete and
      # the step sat in teardown for 27 minutes *after* BUILD SUCCESSFUL.
      #
      # `force-avd-creation: true` and `-no-snapshot` say the same thing
      # twice on purpose: always build the AVD, always cold boot, never write
      # a snapshot. The snapshot write is also what the hung teardown was in
      # the middle of, so not having one to save removes that step entirely.
      - name: Run instrumented tests
        # Step-level, well inside the job's 30. The action does not fail when
        # the emulator dies or refuses to shut down — it blocks — so without
        # this the whole job budget is spent idling and there is no report, no
        # androidTest artifact, and a conclusion that reads as "cancelled".
        # 20 is 8x the measured path and halves the time to a signal.
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      # A red run here means a migration is wrong, and the detail that says
      # which one — the failing assert, the missing column, the Room schema
      # diff — is in the report, not in Gradle's one-line summary. Upload it
      # so the diagnosis does not require reproducing the emulator locally.
      - name: Upload androidTest report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nc_collectives_android-androidTest-report-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          # warn, not error: if the emulator never booted there is no report,
          # and a second red step would bury the one that actually failed.
          if-no-files-found: warn
          retention-days: 14

  # H5: the only job that ever holds the release key, and only on a tag.
  #
  # It runs in the `release` environment, so the maintainer can restrict it
  # to `v*` tags and require an approval, and keep the four
  # ANDROID_RELEASE_* secrets in the environment rather than the repository.
  # Repository secrets keep working until then.
  #
  # No Gradle cache, so a tag build reads nothing that a main or PR run
  # wrote. The secrets reach one step's environment, never $GITHUB_ENV, and
  # the decoded keystore is deleted when that step ends. AGP still does the
  # signing, so the APK is byte for byte what F-Droid's reproducible build
  # compares against. The check after it pins the certificate rather than
  # trusting a filename.
  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the next step can see main.
          fetch-depth: 0

      # Sign only what main already has. A `v*` tag pushed on any other
      # commit — a branch, or a PR head that someone with push access
      # tagged — would otherwise publish a signed release of code main never
      # got, and F-Droid would ship it.
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build and sign the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_RELEASE_KEYSTORE_BASE64"
          [ -n "$ANDROID_RELEASE_STORE_PASSWORD" ] || missing="$missing ANDROID_RELEASE_STORE_PASSWORD"
          [ -n "$ANDROID_RELEASE_KEY_ALIAS" ] || missing="$missing ANDROID_RELEASE_KEY_ALIAS"
          [ -n "$ANDROID_RELEASE_KEY_PASSWORD" ] || missing="$missing ANDROID_RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::these secrets are unset:$missing, so this tag would publish an unsigned APK. See docs/SIGNING.md."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          unset KEYSTORE_BASE64
          ANDROID_RELEASE_KEYSTORE_FILE="$keystore" ./gradlew --no-daemon assembleRelease

      # Signed, and by the key F-Droid pins (AllowedAPKSigningKeys). The old
      # check only looked at the output's filename.
      - name: Verify the APK carries the published signing certificate
        run: |
          out=app/build/outputs/apk/release
          if [ ! -f "$out/app-release.apk" ] || [ -f "$out/app-release-unsigned.apk" ]; then
            echo "::error::the release build was not signed."
            ls -l "$out" || true
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          expected="$(sed -n 's/^AllowedAPKSigningKeys: *//p' docs/fdroid/com.megamaced.nccollectives.yml | tr -d '[:space:]')"
          actual="$("$apksigner" verify --print-certs "$out/app-release.apk" | sed -n 's/.*certificate SHA-256 digest: *//p' | sort -u)"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::signing certificate is '$actual', the published one is '$expected'."
            exit 1
          fi
          echo "Signed with the published certificate $actual"

      # Exact filename, never a glob: app-release-unsigned.apk must not be able
      # to ride along into the artifact the release job publishes.
      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nc_collectives_android-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # `needs: sign` (which needs `build`) — deliberately NOT instrumented-tests.
  # The emulator is the least reliable component in this workflow (boot
  # timeouts, KVM availability, adb dropping the device), and the migration
  # gate has already done its work by tag time: the tagged commit passed
  # instrumented-tests on the PR and again on main. Letting an emulator hiccup
  # block a tagged publish would trade a real risk for an infrastructure one,
  # and the remedy — re-tagging — means burning a version for a bot-driven
  # F-Droid package (see the metadata check above). instrumented-tests still
  # runs on the tag, so a genuine migration failure is visible on the release
  # run; it just does not hold the artifact hostage.
  release:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub release and upload the APK to it
      actions: read    # download this run's release-APK artifact
    steps:
      - name: Download the signed release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nc_collectives_android-release-${{ github.sha }}
          path: dist

      - name: Attach release APK to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
